name: CD - Deploy to ECS Fargate (dev)

# ==============================================================================
# CD Pipeline for ECS Fargate Stateless Services
#
# How it works:
#   1. Authenticates to AWS via GitHub Secrets (IAM credentials).
#   2. Triggers rolling zero-downtime updates on ECS Fargate services:
#        - API Backend (order-platform-api-service)
#        - Frontend UI (order-platform-frontend-service)
#        - Worker Consumer (order-platform-worker-service)
#   3. Fargate automatically pulls new images from Docker Hub, spins up new containers,
#      verifies ALB health checks, shifts traffic over, and terminates old containers.
#   4. Verifies the public ALB URL is responding with HTTP 200.
# ==============================================================================

on:
  workflow_dispatch: # Manual trigger from GitHub Actions UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # 1. Configure AWS Credentials
      # ------------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # ------------------------------------------------------------------------
      # 2. Trigger Rolling Deployments on ECS Fargate Services
      # ------------------------------------------------------------------------
      - name: Deploy API Service to ECS Fargate
        run: |
          echo "🚀 Updating ECS Service: order-platform-api-service..."
          aws ecs update-service \
            --cluster order-platform-cluster \
            --service order-platform-api-service \
            --force-new-deployment

      - name: Deploy Frontend Service to ECS Fargate
        run: |
          echo "🚀 Updating ECS Service: order-platform-frontend-service..."
          aws ecs update-service \
            --cluster order-platform-cluster \
            --service order-platform-frontend-service \
            --force-new-deployment

      - name: Deploy Worker Service to ECS Fargate
        run: |
          echo "🚀 Updating ECS Service: order-platform-worker-service..."
          aws ecs update-service \
            --cluster order-platform-cluster \
            --service order-platform-worker-service \
            --force-new-deployment

      # ------------------------------------------------------------------------
      # 3. Wait for Fargate Services to Stabilize (Health Checks Pass)
      # ------------------------------------------------------------------------
      - name: Wait for Services to Become Healthy & Stable
        run: |
          echo "⏳ Waiting for ECS Fargate tasks to reach steady state..."
          aws ecs wait services-stable \
            --cluster order-platform-cluster \
            --services order-platform-api-service order-platform-frontend-service order-platform-worker-service
          echo "✅ All ECS Fargate services are running and stable!"

      # ------------------------------------------------------------------------
      # 4. Verify Public ALB Endpoints
      # ------------------------------------------------------------------------
      - name: Verify Public Application Load Balancer
        if: vars.ALB_DNS_NAME != ''
        run: |
          ALB_URL="http://${{ vars.ALB_DNS_NAME }}"
          echo "🔍 Checking ALB Health Endpoint: $ALB_URL/health"
          
          for i in $(seq 1 10); do
            if curl -f -s "$ALB_URL/health" > /dev/null; then
              echo "✅ API Health Check passed on attempt $i!"
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

      # ------------------------------------------------------------------------
      # 5. Send Notification (Optional Discord Webhook)
      # ------------------------------------------------------------------------
      - name: Send Discord notification
        if: always() && secrets.DISCORD_WEBHOOK_URL != ''
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ DEPLOY SUCCEEDED"
            COLOR=3066993
          else
            STATUS="❌ DEPLOY FAILED"
            COLOR=15158332
          fi

          curl -H "Content-Type: application/json" -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"CD ECS Deployment: $STATUS\",
                \"description\": \"Cluster: order-platform-cluster\nRegion: ap-south-1\nTriggered by: ${{ github.actor }}\nView run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": $COLOR
              }]
            }" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"