name: CD - Deploy to EC2 (dev) via OIDC + SSM

# ============================================================================
# HOW THIS WORKS (high level)
# ============================================================================
# 1. GitHub mints a short-lived OIDC token proving "this run is repo X,
#    branch Y." No stored AWS keys anywhere in this repo.
# 2. AWS STS trades that token for temporary credentials, based on the
#    trust policy on the IAM role (role-to-assume below).
# 3. We use those temp credentials to call AWS SSM send-command, which
#    queues a shell script to run ON the EC2 instance.
# 4. The SSM Agent on EC2 polls AWS OUTBOUND for queued commands, runs
#    them locally, and reports results back to AWS. No inbound port
#    (no port 22, no SSH) needs to be open on the instance.
# 5. We poll AWS for the result and print stdout/stderr from the
#    instance back into this GitHub Actions log.
# ============================================================================

on:
  workflow_dispatch:

permissions:
  id-token: write
  # Required for GitHub to mint an OIDC token for this job. Without this,
  # "Configure AWS credentials" fails immediately with
  # "Credentials could not be loaded."
  contents: read
  # Lets actions/checkout read repo content if ever added later.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      # ------------------------------------------------------------------
      # STEP 1: Authenticate to AWS via OIDC (no stored keys/secrets)
      # ------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # ------------------------------------------------------------------
      # STEP 2: Confirm the OIDC auth actually worked, print who we are.
      # If THIS step fails, the problem is in OIDC/IAM trust policy,
      # not in anything below it.
      # ------------------------------------------------------------------
      - name: Sanity check auth
        run: |
          echo "=== Checking assumed AWS identity ==="
          aws sts get-caller-identity
          echo "=== AWS region in use ==="
          aws configure get region || echo "region not set via configure, using env"
          echo "Region env var: $AWS_REGION"

      # ------------------------------------------------------------------
      # STEP 3: Confirm the target inputs are actually populated.
      # Catches a bad/missing repo variable BEFORE we waste an SSM call.
      # ------------------------------------------------------------------
      - name: Print deploy target info
        run: |
          echo "=== Deploy target info ==="
          echo "EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}"
          echo "AWS_ROLE_ARN:    ${{ vars.AWS_ROLE_ARN }}"
          echo "Commit SHA (image tag): ${{ github.sha }}"
          echo "Triggered ref: ${{ github.ref }}"

          if [ -z "${{ vars.EC2_INSTANCE_ID }}" ]; then
            echo "ERROR: EC2_INSTANCE_ID repo variable is empty. Aborting."
            exit 1
          fi

      # ------------------------------------------------------------------
      # STEP 4: Confirm the instance is actually registered with SSM
      # and online. This is the #1 cause of "send-command" silently
      # having nothing to run against -- SSM Agent not running, or
      # instance IAM role missing SSM core policy.
      # ------------------------------------------------------------------
      - name: Verify instance is SSM-managed and online
        run: |
          echo "=== Checking SSM registration status for instance ==="
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ vars.EC2_INSTANCE_ID }}" \
            --output table

          PING_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ vars.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

          echo "Ping status: $PING_STATUS"

          if [ "$PING_STATUS" != "Online" ]; then
            echo "ERROR: Instance is not Online in SSM (status: $PING_STATUS)."
            echo "Check: SSM Agent running? Instance IAM role has AmazonSSMManagedInstanceCore?"
            echo "Instance has outbound internet/VPC endpoint access to SSM?"
            exit 1
          fi

      # ------------------------------------------------------------------
      # STEP 5: Build the SSM command JSON file.
      #
      # IMPORTANT: this heredoc writes RAW file content. JSON has no
      # comment syntax, and a heredoc does not strip "#" lines -- they
      # get written into the file as literal invalid JSON. So there are
      # NO comments inside the EOF block below. All explanation lives
      # here, outside the heredoc:
      #
      #   mkdir -p ...                -> ensures target dir exists on EC2
      #   aws s3 sync ...             -> runs ON EC2, pulls deploy files
      #                                  from S3 (compose file + scripts).
      #                                  Requires the EC2 INSTANCE ROLE
      #                                  (not this GitHub OIDC role) to
      #                                  have s3:GetObject + s3:ListBucket
      #                                  on this bucket/path.
      #   chmod +x deploy.sh          -> S3 downloads lose the unix
      #                                  execute bit, so this is required
      #                                  every single deploy.
      #   bash deploy.sh $IMAGE_TAG   -> actual deploy logic (docker pull,
      #                                  up -d, health check). Lives
      #                                  entirely on EC2, where secrets
      #                                  like DOCKERHUB_TOKEN are fetched
      #                                  locally via SSM Parameter Store.
      #                                  Non-zero exit here = SSM command
      #                                  marked Failed = this job fails.
      # ------------------------------------------------------------------
      - name: Build SSM command payload
        run: |
          IMAGE_TAG=${{ github.sha }}
          BUCKET=order-platform-tf-state-891274465984

          cat > params.json << EOF
          {
            "commands": [
              "mkdir -p /home/ubuntu/order-platform",
              "aws s3 sync s3://${BUCKET}/deploy/dev/artifacts/ /home/ubuntu/order-platform/",
              "chmod +x /home/ubuntu/order-platform/scripts/dev/deploy.sh",
              "bash /home/ubuntu/order-platform/scripts/dev/deploy.sh ${IMAGE_TAG}"
            ]
          }
          EOF

          echo "=== params.json written, validating JSON syntax ==="
          if ! python3 -m json.tool params.json > /dev/null; then
            echo "ERROR: params.json is not valid JSON. Contents below:"
            cat params.json
            exit 1
          fi
          echo "params.json is valid JSON. Contents:"
          cat params.json

      # ------------------------------------------------------------------
      # STEP 6: Send the command to SSM and capture the Command ID.
      # This call only QUEUES the command -- it does not wait for
      # completion. If this step itself fails, it's an IAM/permissions
      # or malformed-payload problem on the GitHub Actions side.
      # ------------------------------------------------------------------
      - name: Send deploy command via SSM
        id: send_command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CD deploy ${{ github.sha }}" \
            --parameters file://params.json \
            --query "Command.CommandId" \
            --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" == "None" ]; then
            echo "ERROR: send-command did not return a Command ID."
            exit 1
          fi

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # STEP 7: Wait for the command to finish, then ALWAYS print
      # stdout/stderr from the instance -- regardless of success or
      # failure -- so we can see what actually happened. We do NOT use
      # `set -e` here on purpose: if the wait itself reports a failure,
      # we still want to reach the point where we print the logs before
      # the job exits non-zero.
      # ------------------------------------------------------------------
      - name: Wait for SSM command and fetch output
        run: |
          COMMAND_ID="${{ steps.send_command.outputs.command_id }}"
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          echo "=== Waiting for command $COMMAND_ID to finish on $INSTANCE_ID ==="
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || echo "wait returned non-zero (command likely failed) -- continuing to fetch logs"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "=== Final SSM command status: $STATUS ==="

          echo "--- STDOUT from instance ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "--- STDERR from instance ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "=== Deploy FAILED (status: $STATUS) -- see STDOUT/STDERR above ==="
            exit 1
          fi

          echo "=== Deploy succeeded ==="