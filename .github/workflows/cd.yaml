name: CD - Deploy to EC2 (dev)

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC — lets THIS workflow request a token from GitHub
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only what CD needs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            scripts/dev
          sparse-checkout-cone-mode: false

      # This is the OIDC handshake — GitHub generates a fresh token, presents
      # it to AWS, AWS checks it against the trust policy we built, and
      # returns temporary credentials valid for this job only.
      - name: Debug - decode OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-south-1

      # Deploy files land in S3 first — the instance will pull them from here.
      - name: Upload deploy files to S3
        run: |
          aws s3 cp docker-compose.yml s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/docker-compose.yml
          aws s3 cp scripts/dev/rollback.sh s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/rollback.sh
          aws s3 cp scripts/dev/update-version.sh s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/update-version.sh
          aws s3 cp scripts/dev/fetch_secrets.sh s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/fetch_secrets.sh

      # This is the actual replacement for SSH: no connection is opened.
      # We hand AWS a shell script; AWS relays it to the instance's SSM
      # agent over the agent's own OUTBOUND connection; the instance runs
      # it and reports back. No inbound port involved anywhere.
      - name: Deploy via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CD deploy ${{ github.sha }}" \
            --parameters commands="[
              'mkdir -p /home/ubuntu/order-platform/scripts/dev',
              'aws s3 cp s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/docker-compose.yml /home/ubuntu/order-platform/docker-compose.yml',
              'aws s3 cp s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/rollback.sh /home/ubuntu/order-platform/scripts/dev/rollback.sh',
              'aws s3 cp s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/update-version.sh /home/ubuntu/order-platform/scripts/dev/update-version.sh',
              'aws s3 cp s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/fetch_secrets.sh /home/ubuntu/order-platform/scripts/dev/fetch_secrets.sh',
              'chmod +x /home/ubuntu/order-platform/scripts/dev/*.sh',
              'cd /home/ubuntu/order-platform && source scripts/dev/fetch_secrets.sh && echo $DOCKERHUB_TOKEN | docker login -u $DOCKERHUB_USERNAME --password-stdin && export IMAGE_TAG=${{ github.sha }} && docker compose -f docker-compose.yml pull && docker compose -f docker-compose.yml up -d && for i in $(seq 1 15); do curl -f -s http://localhost:4000/health > /dev/null && echo HEALTHY && bash scripts/dev/update-version.sh ${{ github.sha }} && exit 0; sleep 3; done; echo UNHEALTHY && exit 1'
            ]" \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Command sent: $COMMAND_ID"

      # SSM doesn't stream output live — we have to poll until the command
      # reports a final status, then fetch its stdout/stderr.
      - name: Poll for command completion
        run: |
          COMMAND_ID="${{ steps.ssm.outputs.command_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region ap-south-1 \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: status = $STATUS"

            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            sleep 5
          done

          echo "----- Command output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --region ap-south-1 \
            --query "StandardOutputContent" --output text

          echo "----- Command errors (if any) -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --region ap-south-1 \
            --query "StandardErrorContent" --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed. Status: $STATUS"
            exit 1
          fi