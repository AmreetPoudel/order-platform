name: CD - Deploy to EC2 (dev) via OIDC + SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Sanity check auth
        run: aws sts get-caller-identity

      - name: Deploy via SSM
        run: |
          IMAGE_TAG=${{ github.sha }}
          BUCKET=order-platform-tf-state-891274465984

          cat > params.json << EOF
          {
            "commands": [
              "mkdir -p /home/ubuntu/order-platform",
              "aws s3 sync s3://${BUCKET}/deploy/dev/artifacts/ /home/ubuntu/order-platform/",
              "chmod +x /home/ubuntu/order-platform/scripts/dev/deploy.sh",
              "bash /home/ubuntu/order-platform/scripts/dev/deploy.sh ${IMAGE_TAG}"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CD deploy $IMAGE_TAG" \
            --parameters file://params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text