name: CD - Deploy to EC2 (dev)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only what CD needs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            scripts/dev
          sparse-checkout-cone-mode: false

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,scripts/dev/rollback.sh,scripts/dev/update-version.sh,scripts/dev/fetch_secrets.sh"
          target: "/home/ubuntu/order-platform"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/order-platform
            chmod +x scripts/dev/*.sh

            source scripts/dev/fetch_secrets.sh

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            export IMAGE_TAG=${{ github.sha }}
            docker-compose -f docker-compose.yml pull
            docker-compose -f docker-compose.yml up -d


            echo "Waiting for API to become healthy..."
            for i in $(seq 1 15); do
              if curl -f -s http://localhost:4000/health > /dev/null; then
                echo "Health check passed on attempt $i."
                HEALTHY=true
                break
              fi
              echo "Attempt $i failed, retrying in 3s..."
              sleep 3
            done

            if [ "${HEALTHY:-false}" != "true" ]; then
              echo "Health check failed after all retries."
              echo "Run manually if needed: bash scripts/dev/rollback.sh"
              exit 1
            fi

            bash scripts/dev/update-version.sh "$IMAGE_TAG"
            echo "Deploy succeeded and verified."