name: CD - Deploy to EC2 (dev) via OIDC + SSM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only what CD needs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            scripts/dev
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Sanity check auth
        run: aws sts get-caller-identity

      - name: Upload deploy files to S3
        run: |
          aws s3 cp docker-compose.yml \
            s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/docker-compose.yml
          aws s3 cp scripts/dev/rollback.sh \
            s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/scripts/dev/rollback.sh
          aws s3 cp scripts/dev/update-version.sh \
            s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/scripts/dev/update-version.sh
          aws s3 cp scripts/dev/fetch_secrets.sh \
            s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/scripts/dev/fetch_secrets.sh

      - name: Deploy via SSM
        run: |
          IMAGE_TAG=${{ github.sha }}

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CD deploy $IMAGE_TAG" \
            --parameters "commands=[
              'set -euo pipefail',
              'mkdir -p /home/ubuntu/order-platform/scripts/dev',
              'aws s3 sync s3://order-platform-tf-state-891274465984/deploy/dev/artifacts/ /home/ubuntu/order-platform/',
              'cd /home/ubuntu/order-platform',
              'chmod +x scripts/dev/*.sh',
              'source scripts/dev/fetch_secrets.sh',
              'echo \"$DOCKERHUB_TOKEN\" | docker login -u \"$DOCKERHUB_USERNAME\" --password-stdin',
              'export IMAGE_TAG='$IMAGE_TAG'',
              'docker compose -f docker-compose.yml pull',
              'docker compose -f docker-compose.yml up -d',
              'for i in $(seq 1 15); do if curl -f -s http://localhost:4000/health > /dev/null; then echo Health check passed; HEALTHY=true; break; fi; echo retry $i; sleep 3; done',
              'if [ \"${HEALTHY:-false}\" != \"true\" ]; then echo Health check failed; exit 1; fi',
              'bash scripts/dev/update-version.sh '$IMAGE_TAG''
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text