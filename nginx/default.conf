server {
    listen 80;
    server_name _;

    location / {
        # In Docker Compose, the API service is reachable at http://api:4000
        # In AWS ECS Fargate (awsvpc network mode), containers in the same task share localhost, so http://127.0.0.1:4000 can be used.
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
