server {
    listen 80;
    server_name _;

    location / {
        # Proxy incoming port 80 traffic to the frontend container
        # In Docker Compose: http://frontend:80
        # In ECS Fargate (awsvpc): http://127.0.0.1:80 (if sidecar with different internal port) or http://frontend:80 (via Service Discovery)
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
